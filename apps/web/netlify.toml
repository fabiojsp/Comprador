# Netlify: monorepo con npm workspaces; la app Next.js está en apps/web.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Adaptador oficial de Next.js (rutas de servidor, middleware, API).
[[plugins]]
  package = "@netlify/plugin-nextjs"
